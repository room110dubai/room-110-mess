<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Room 110 Mess</title>
<style>
*{box-sizing:border-box;font-family:sans-serif;margin:0}
body{background:#090d16;color:#fff;padding-bottom:40px}
.wrap{max-width:750px;margin:auto;padding:14px}
.card{background:#111827;border:1px solid #1f2937;border-radius:14px;padding:16px;margin-bottom:12px}
label{display:block;font-size:11px;color:#9ca3af;margin:8px 0 4px;text-transform:uppercase;font-weight:700}
input,select{width:100%;background:#1f2937;border:1px solid #374151;color:#fff;padding:11px;border-radius:10px;font-size:14px}
.btn{width:100%;background:#2563eb;color:#fff;border:0;padding:12px;border-radius:10px;font-weight:700;margin-top:12px;cursor:pointer}
.btn-s{width:auto;padding:7px 10px;font-size:12px;margin:0}
.top{background:#111827;border-bottom:1px solid #1f2937;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;background:#1f2937;color:#9ca3af;border:0;padding:10px;border-radius:10px;font-weight:700;font-size:12px}
.tab.on{background:#2563eb;color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th,td{padding:10px;border-bottom:1px solid #1f2937;text-align:left}
.g{color:#34d399;font-weight:700}.r{color:#fb7185;font-weight:700}.hide{display:none!important}
.cks{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#090d16;padding:10px;border-radius:10px;margin-top:8px}
.ck{display:flex;align-items:center;gap:6px;font-size:13px}.ck input{width:16px;height:16px}
</style>
</head>
<body>

<div id="loginBox" class="wrap" style="max-width:380px;margin-top:12vh">
  <div class="card">
    <h2 style="text-align:center;color:#60a5fa;margin-bottom:4px">Room 110 Mess Portal</h2>
    <p style="text-align:center;font-size:12px;color:#9ca3af;margin-bottom:14px">Shared Expense Splitter & Ledger</p>
    <p id="err" style="color:#fb7185;font-size:13px;text-align:center;margin-bottom:8px"></p>
    <form onsubmit="login(event)">
      <label>User ID</label><input id="uid" required placeholder="Enter User ID">
      <label>Password</label><input id="upass" type="password" required placeholder="Enter Password">
      <button class="btn">Sign In to Room 110</button>
    </form>
  </div>
</div>

<div id="appBox" class="hide">
  <div class="top">
    <div><strong style="color:#60a5fa">Room 110 Mess</strong><div id="who" style="font-size:11px;color:#9ca3af"></div></div>
    <div style="display:flex;gap:6px">
      <button class="btn btn-s" style="background:#059669" onclick="wa()">WhatsApp</button>
      <button class="btn btn-s" style="background:#dc2626" onclick="logout()">Logout</button>
    </div>
  </div>
  <div class="wrap">
    <div class="tabs">
      <button id="t1" class="tab on" onclick="tab(1)">Ledger</button>
      <button id="t2" class="tab" onclick="tab(2)">+ Expense</button>
      <button id="t3" class="tab" onclick="tab(3)">History</button>
      <button id="t4" class="tab hide" onclick="tab(4)">Admin</button>
    </div>
    <div id="v1">
      <div class="card" style="display:flex;justify-content:space-between">
        <div><label>Total Spent</label><h2 id="tot">AED 0</h2></div>
        <div style="text-align:right"><label>Members</label><h2 id="mcount" style="color:#60a5fa">0</h2></div>
      </div>
      <div class="card">
        <strong>Member Balances (+ Gets / - Pays)</strong>
        <table><thead><tr><th>Name</th><th>Paid</th><th>Share</th><th>Net</th></tr></thead><tbody id="tb"></tbody></table>
      </div>
    </div>
    <div id="v2" class="card hide">
      <h3>Add Room 110 Expense</h3>
      <form onsubmit="addEx(event)">
        <label>Amount (AED)</label><input id="amt" type="number" step="0.01" required>
        <label>Items / Category</label><input id="desc" placeholder="e.g. Groceries, Chicken, Gas" required>
        <label>Paid By</label><select id="pby"></select>
        <label>Split Between</label>
        <select id="stype" onchange="document.getElementById('cbox').className=this.value=='c'?'cks':'cks hide'">
          <option value="a">All Room 110 Members</option><option value="c">Select Specific Members</option>
        </select>
        <div id="cbox" class="cks hide"></div>
        <button class="btn">Save Expense</button>
      </form>
    </div>
    <div id="v3" class="hide"><div id="hlist"></div></div>
    <div id="v4" class="hide">
      <div class="card">
        <h3>Create Member Account</h3>
        <form onsubmit="addU(event)">
          <label>Name</label><input id="nname" required oninput="document.getElementById('nid').value=this.value.toLowerCase().replace(/[^a-z0-9]/g,'')">
          <label>User ID</label><input id="nid" required>
          <label>Password</label><input id="npass" required>
          <label>Role</label><select id="nrole"><option value="user">User (View & Add)</option><option value="admin">Admin (Full Control)</option></select>
          <button class="btn">Add Member</button>
        </form>
      </div>
      <div id="ulist" class="card"></div>
    </div>
  </div>
</div>

<script>
var users=JSON.parse(localStorage.getItem("r110_u")||"null")||[{id:1,name:"Shyam",u:"shyam",p:"admin123",r:"admin"}];
var exps=JSON.parse(localStorage.getItem("r110_e")||"null")||[];
var cur=null;
function save(){localStorage.setItem("r110_u",JSON.stringify(users));localStorage.setItem("r110_e",JSON.stringify(exps));render()}
function login(e){
  e.preventDefault();
  var u=document.getElementById("uid").value.trim().toLowerCase(),p=document.getElementById("upass").value.trim();
  cur=users.find(function(x){return x.u.toLowerCase()==u&&x.p==p});
  if(cur){document.getElementById("loginBox").className="hide";document.getElementById("appBox").className="";tab(1)}
  else document.getElementById("err").innerText="Invalid User ID or Password";
}
function logout(){cur=null;document.getElementById("appBox").className="hide";document.getElementById("loginBox").className="wrap"}
function tab(n){
  for(var i=1;i<=4;i++){
    document.getElementById("t"+i).className="tab"+(i==n?" on":"")+(i==4&&cur.r!="admin"?" hide":"");
    document.getElementById("v"+i).className=(i==n?(i==2?"card":""):"hide");
  }
  render();
}
function addU(e){
  e.preventDefault();
  var n=document.getElementById("nname").value.trim(),u=document.getElementById("nid").value.trim().toLowerCase(),p=document.getElementById("npass").value.trim(),r=document.getElementById("nrole").value;
  if(users.some(function(x){return x.u==u}))return alert("User ID exists!");
  users.push({id:Date.now(),name:n,u:u,p:p,r:r});
  document.getElementById("nname").value="";document.getElementById("nid").value="";document.getElementById("npass").value="";
  save();
}
function delU(id){if(users.length>1&&confirm("Delete user?")){users=users.filter(function(x){return x.id!=id});save()}}
function addEx(e){
  e.preventDefault();
  var a=parseFloat(document.getElementById("amt").value),d=document.getElementById("desc").value.trim(),pb=document.getElementById("pby").value,st=document.getElementById("stype").value;
  var al=st=="a"?users.map(function(x){return x.name}):Array.from(document.querySelectorAll(".mck:checked")).map(function(c){return c.value});
  if(!al.length)return alert("Select at least 1 member");
  exps.unshift({id:Date.now(),amt:a,desc:d,pb:pb,al:al,dt:new Date().toLocaleDateString()});
  document.getElementById("amt").value="";document.getElementById("desc").value="";
  save();tab(1);
}
function delEx(id){if(confirm("Delete expense?")){exps=exps.filter(function(x){return x.id!=id});save()}}
function stats(){
  var tot=exps.reduce(function(s,x){return s+Number(x.amt)},0);
  var st=users.map(function(u){
    var pd=exps.filter(function(x){return x.pb==u.name}).reduce(function(s,x){return s+Number(x.amt)},0);
    var sh=exps.reduce(function(s,x){return x.al.indexOf(u.name)>-1?s+(Number(x.amt)/x.al.length):s},0);
    return {name:u.name,pd:pd,sh:sh,net:pd-sh};
  });
  return {tot:tot,st:st};
}
function wa(){
  var s=stats(),txt="*ROOM 110 MESS*\nTotal: AED "+s.tot.toFixed(2)+"\n----------------\n";
  s.st.forEach(function(m){txt+="• "+m.name+": Paid "+m.pd.toFixed(0)+" | Share "+m.sh.toFixed(1)+" -> "+(m.net>=0?"Gets +":"Pays -")+"AED "+Math.abs(m.net).toFixed(2)+"\n"});
  navigator.clipboard.writeText(txt);alert("WhatsApp Report Copied!");
}
function render(){
  if(!cur)return;
  document.getElementById("who").innerText=cur.name+" ("+cur.r+")";
  var s=stats();
  document.getElementById("tot").innerText="AED "+s.tot.toFixed(2);
  document.getElementById("mcount").innerText=users.length;
  document.getElementById("tb").innerHTML=s.st.map(function(m){return "<tr><td><b>"+m.name+"</b></td><td>"+m.pd.toFixed(1)+"</td><td>"+m.sh.toFixed(1)+"</td><td class='"+(m.net>=0?"g":"r")+"'>"+(m.net>=0?"+":"")+m.net.toFixed(2)+"</td></tr>"}).join("");
  document.getElementById("pby").innerHTML=users.map(function(u){return "<option value='"+u.name+"' "+(u.name==cur.name?"selected":"")+">"+u.name+"</option>"}).join("");
  document.getElementById("cbox").innerHTML=users.map(function(u){return "<label class='ck'><input type='checkbox' class='mck' value='"+u.name+"' checked><span>"+u.name+"</span></label>"}).join("");
  document.getElementById("hlist").innerHTML=exps.length?exps.map(function(x){return "<div class='card' style='display:flex;justify-content:space-between;align-items:center'><div><b>"+x.desc+"</b><div style='font-size:12px;color:#9ca3af'>Paid by "+x.pb+" • "+x.dt+" • ("+x.al.length+" members)</div></div><div><b>AED "+Number(x.amt).toFixed(2)+"</b> "+(cur.r=="admin"?"<button class='btn btn-s' style='background:#dc2626;margin-left:6px' onclick='delEx("+x.id+")'>X</button>":"")+"</div></div>"}).join(""):"<div class='card'>No expenses yet.</div>";
  if(cur.r=="admin")document.getElementById("ulist").innerHTML=users.map(function(u){return "<div style='padding:10px 0;border-bottom:1px solid #1f2937;display:flex;justify-content:space-between;align-items:center'><div><b>"+u.name+"</b><div style='font-size:12px;color:#9ca3af'>ID: "+u.u+" | Pass: "+u.p+" | "+u.r+"</div></div><button class='btn btn-s' style='background:#dc2626' onclick='delU("+u.id+")'>Delete</button></div>"}).join("");
}
</script>
</body>
</html>
