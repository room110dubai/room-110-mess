<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room 110 Mess Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">

  <div id="app"></div>

  <script>
    // Default Admin Account (Hidden from Login Screen)
    const DEFAULT_USERS = [
      { id: 'admin-1', name: 'Shyam', username: 'shyam', password: 'admin123', role: 'admin' }
    ];

    let state = {
      currentUser: null,
      users: JSON.parse(localStorage.getItem('room110_users') || 'null') || DEFAULT_USERS,
      expenses: JSON.parse(localStorage.getItem('room110_expenses') || 'null') || [],
      apiUrl: localStorage.getItem('room110_api_url') || '',
      activeTab: 'ledger',
      splitType: 'all',
      error: '',
      successMsg: ''
    };

    function saveLocal() {
      localStorage.setItem('room110_users', JSON.stringify(state.users));
      localStorage.setItem('room110_expenses', JSON.stringify(state.expenses));
    }

    function showMessage(msg, isError = false) {
      if (isError) {
        state.error = msg;
        state.successMsg = '';
      } else {
        state.successMsg = msg;
        state.error = '';
        setTimeout(() => { state.successMsg = ''; render(); }, 3000);
      }
      render();
    }

    async function syncCloud() {
      if (!state.apiUrl) return;
      try {
        const res = await fetch(state.apiUrl);
        const data = await res.json();
        if (data.users && data.users.length) state.users = data.users;
        if (data.expenses) state.expenses = data.expenses;
        saveLocal();
        showMessage('Synced with Room 110 Cloud!');
      } catch (e) {
        showMessage('Cloud sync failed. Using local data.', true);
      }
    }

    async function pushCloud() {
      if (!state.apiUrl) return;
      try {
        await fetch(state.apiUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ users: state.users, expenses: state.expenses })
        });
      } catch (e) {}
    }

    function handleLogin(e) {
      e.preventDefault();
      const uid = document.getElementById('loginId').value.trim().toLowerCase();
      const pass = document.getElementById('loginPass').value.trim();
      const found = state.users.find(u => u.username.toLowerCase() === uid && u.password === pass);
      if (found) {
        state.currentUser = found;
        state.error = '';
        render();
      } else {
        showMessage('Invalid User ID or Password.', true);
      }
    }

    function handleLogout() {
      state.currentUser = null;
      state.activeTab = 'ledger';
      render();
    }

    function setTab(tab) {
      state.activeTab = tab;
      state.error = '';
      render();
    }

    function handleAddExpense(e) {
      e.preventDefault();
      const amount = parseFloat(document.getElementById('expAmount').value);
      const category = document.getElementById('expCategory').value;
      const paidBy = document.getElementById('expPaidBy').value;
      const desc = document.getElementById('expDesc').value.trim() || category;

      if (!amount || amount <= 0) {
        showMessage('Please enter a valid amount in AED.', true);
        return;
      }

      let allocated = [];
      if (state.splitType === 'all') {
        allocated = state.users.map(u => u.name);
      } else {
        document.querySelectorAll('.member-checkbox:checked').forEach(cb => {
          allocated.push(cb.value);
        });
      }

      if (allocated.length === 0) {
        showMessage('Select at least 1 member to split this expense.', true);
        return;
      }

      const newExp = {
        id: 'exp-' + Date.now(),
        paidBy,
        amount,
        category,
        description: desc,
        date: new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }),
        splitType: state.splitType,
        allocatedTo: allocated
      };

      state.expenses.unshift(newExp);
      saveLocal();
      pushCloud();
      state.activeTab = 'ledger';
      showMessage('Expense saved to Room 110 Ledger!');
    }

    function deleteExpense(id) {
      if (confirm('Delete this expense entry?')) {
        state.expenses = state.expenses.filter(ex => ex.id !== id);
        saveLocal();
        pushCloud();
        render();
      }
    }

    function handleAddUser(e) {
      e.preventDefault();
      const name = document.getElementById('newUserName').value.trim();
      const username = document.getElementById('newUserId').value.trim().toLowerCase();
      const password = document.getElementById('newUserPass').value.trim();
      const role = document.getElementById('newUserRole').value;

      if (!name || !username || !password) {
        showMessage('Please fill in all fields.', true);
        return;
      }
      if (state.users.some(u => u.username.toLowerCase() === username)) {
        showMessage('That User ID already exists!', true);
        return;
      }

      state.users.push({
        id: 'user-' + Date.now(),
        name,
        username,
        password,
        role
      });
      saveLocal();
      pushCloud();
      showMessage('Roommate added to Room 110!');
    }

    function deleteUser(id) {
      if (state.users.length <= 1) {
        showMessage('Cannot delete the last admin account.', true);
        return;
      }
      if (confirm('Remove this roommate from Room 110?')) {
        state.users = state.users.filter(u => u.id !== id);
        saveLocal();
        pushCloud();
        render();
      }
    }

    function copyLogin(username, password, name) {
      const msg = `*Room 110 Mess Login*\nLink: ${window.location.href}\nUser ID: ${username}\nPassword:${password}`;
      navigator.clipboard.writeText(msg);
      showMessage(`Copied login for ${name}!`);
    }

    function getStats() {
      const totalSpent = state.expenses.reduce((s, ex) => s + Number(ex.amount), 0);
      const memberStats = state.users.map(u => {
        const paid = state.expenses.filter(ex => ex.paidBy === u.name).reduce((s, ex) => s + Number(ex.amount), 0);
        const consumed = state.expenses.reduce((s, ex) => {
          const alloc = Array.isArray(ex.allocatedTo) ? ex.allocatedTo : [];
          return alloc.includes(u.name) ? s + (Number(ex.amount) / alloc.length) : s;
        }, 0);
        return { name: u.name, role: u.role, paid, consumed, net: paid - consumed };
      });
      return { totalSpent, memberStats };
    }

    function copyWhatsAppSummary() {
      const { totalSpent, memberStats } = getStats();
      const lines = [
        `*ROOM 110 MESS SUMMARY*`,
        `Total Mess Spent: *AED ${totalSpent.toFixed(2)}*`, `Members: *${state.users.length}*`,
        `------------------------`,
        ...memberStats.map(m => {
          const status = m.net >= 0 ? `Gets +AED ${m.net.toFixed(2)}` : `Pays -AED ${Math.abs(m.net).toFixed(2)}`;
          return `• *${m.name}*: Paid${m.paid.toFixed(0)} | Share ${m.consumed.toFixed(1)} ➜ *${status}*`;
        })
      ];
      navigator.clipboard.writeText(lines.join('\n'));
      showMessage('WhatsApp Summary Copied!');
    }

    function render() {
      const app = document.getElementById('app');

      // 1. LOGIN VIEW
      if (!state.currentUser) {
        app.innerHTML = `
          <div class="min-h-screen flex items-center justify-center p-4 bg-slate-950">
            <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 sm:p-8">
              <div class="text-center mb-6">
                <div class="w-16 h-16 bg-blue-600/20 text-blue-400 rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl font-bold border border-blue-500/30">
                  <i class="fa-solid fa-door-open"></i>
                </div>
                <h1 class="text-2xl font-bold text-white">Room 110 Mess Portal</h1>
                <p class="text-slate-400 text-sm mt-1">Shared Expense Splitter & Ledger</p>
              </div>

              ${state.error ? `
                <div class="mb-4 p-3 bg-red-500/10 border border-red-500/30 rounded-xl text-red-400 text-sm flex items-center gap-2">
                  <i class="fa-solid fa-triangle-exclamation"></i>
                  <span>${state.error}</span>
                </div>
              ` : ''}

              <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                  <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">User ID</label>
                  <input id="loginId" type="text" placeholder="Enter User ID" required
                    class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500" />
                </div>
                <div>
                  <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Password</label>
                  <input id="loginPass" type="password" placeholder="Enter Password" required
                    class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500" />
                </div>
                <button type="submit"
                  class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-blue-600/20 flex items-center justify-center gap-2">
                  <i class="fa-solid fa-right-to-bracket"></i>
                  <span>Sign In to Room 110</span>
                </button>
              </form>
            </div>
          </div>
        `;
        return;
      }

      // 2. LOGGED-IN VIEW
      const { totalSpent, memberStats } = getStats();
      const isAdmin = state.currentUser.role === 'admin';

      let tabContent = '';

      if (state.activeTab === 'ledger') {
        tabContent = `
          <div class="space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5">
                <p class="
