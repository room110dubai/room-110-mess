<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room 110 Mess Portal</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background-color: #090d16; color: #f1f5f9; min-height: 100vh; }
    .container { max-width: 850px; margin: 0 auto; padding: 16px; }
    .card { background-color: #111827; border: 1px solid #1f2937; border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .login-card { width: 100%; max-width: 400px; background-color: #111827; border: 1px solid #1f2937; border-radius: 20px; padding: 28px 24px; }
    .badge-110 { width: 56px; height: 56px; background: rgba(37,99,235,0.2); border: 1px solid rgba(59,130,246,0.4); color: #60a5fa; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; margin: 0 auto 12px; }
    h1, h2, h3, p { margin: 0; }
    label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: #9ca3af; margin-bottom: 6px; letter-spacing: 0.05em; }
    input, select { width: 100%; background-color: #1f2937; border: 1px solid #374151; color: #fff; padding: 12px 14px; border-radius: 12px; font-size: 15px; margin-bottom: 14px; outline: none; }
    input:focus, select:focus { border-color: #3b82f6; }
    .btn { width: 100%; background-color: #2563eb; color: #fff; border: none; padding: 13px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn:active { background-color: #1d4ed8; }
    .btn-sm { width: auto; padding: 8px 12px; font-size: 12px; border-radius: 10px; }
    .btn-green { background-color: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
    .btn-red { background-color: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
    .topbar { background-color: #111827; border-bottom: 1px solid #1f2937; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 20; }
    .tabs { display: flex; gap: 6px; background: #111827; padding: 6px; border-radius: 14px; border: 1px solid #1f2937; margin-bottom: 16px; overflow-x: auto; }
    .tab-btn { flex: 1; background: transparent; color: #9ca3af; border: none; padding: 10px; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .tab-btn.active { background-color: #2563eb; color: #fff; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { text-align: left; padding: 12px; background: #090d16; color: #9ca3af; font-size: 11px; text-transform: uppercase; }
    td { padding: 12px; border-top: 1px solid #1f2937; }
    .text-green { color: #34d399; font-weight: 700; }
    .text-red { color: #fb7185; font-weight: 700; }
    .alert { padding: 12px; border-radius: 12px; margin-bottom: 14px; font-size: 13px; display: none; }
    .alert-err { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #f87171; }
    .alert-ok { background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.3); color: #34d399; }
    .member-checks { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; background: #090d16; padding: 12px; border-radius: 12px; border: 1px solid #1f2937; margin-bottom: 14px; }
    .check-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .check-item input { width: 18px; height: 18px; margin: 0; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- 1. LOGIN SCREEN (Built into HTML so it NEVER shows a blank page) -->
  <div id="loginScreen" class="login-wrap">
    <div class="login-card">
      <div style="text-align:center; margin-bottom:22px;">
        <div class="badge-110">1
